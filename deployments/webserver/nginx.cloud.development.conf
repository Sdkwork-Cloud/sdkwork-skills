# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/skills/webserver.pid;
error_log /var/log/sdkwork/skills/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name skills-dev.sdkwork.com skills-dev.birdcoder.com skills-dev.dtupay.com skills-dev.sdkwork.cn skills-dev.birdcoder.cn skills-dev.dtupay.cn skills-dev.skubc.com skills-dev.skubc.cn skills-dev.zowalk.com skills-dev.zowalk.cn skills-dev.offer86.com skills-dev.offer86.cn skills-dev.86offer.com skills-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
